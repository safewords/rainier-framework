[package]
name = "rainier-container"
description = "Rainier's IoC container, service providers, application lifecycle and facade machinery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rainier-support = { workspace = true }
# Only `rt`, for `task_local!` and `spawn`. Deliberately not the workspace's
# tokio, which carries `net` and stops this crate compiling for wasm.
tokio = { version = "1", default-features = false, features = ["rt"] }
tracing = { workspace = true }

# Failures this crate works around are reported on the event bus. Not on wasm:
# `rainier-events` takes the workspace's tokio, whose `net` feature pulls in
# mio, which does not build for wasm32 — and this crate must.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rainier-events = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
