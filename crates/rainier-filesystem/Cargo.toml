[package]
name = "rainier-filesystem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "File storage for Rainier: a Filesystem port with local, in-memory and S3/R2 drivers."

[dependencies]
rainier-support = { workspace = true }
rainier-events = { workspace = true }
# The AWS connector behind the `s3` disk. Compiled only with that feature.
rainier-drivers = { workspace = true, optional = true }

async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
# A disk on a driver the framework does not ship carries that driver's own
# settings, which have to survive from the configuration tree to the factory
# without this crate knowing what they are. The tree is a `serde_json::Value`
# already, so this is the shape they arrive in rather than a second one.
serde_json = { workspace = true }
tokio = { workspace = true }
# The `telemetry` spans, and nothing else.
tracing = { workspace = true, optional = true }


[features]
default = []
# S3, Cloudflare R2, MinIO, and anything else that speaks S3.
s3 = ["dep:rainier-drivers", "rainier-drivers/aws-s3"]
# A `storage.*` span per operation on every disk a `Storage` holds — never the
# path or the contents. See `rainier_filesystem::telemetry`.
telemetry = ["rainier-support/telemetry", "dep:tracing"]

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
