[package]
name = "rainier-mfa"
description = "Multi-factor authentication for Rainier: TOTP with recovery codes, and WebAuthn passkeys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["totp", "2fa", "webauthn", "passkeys", "rainier"]
categories = ["authentication", "web-programming"]

[dependencies]
# The only dependency of a build with neither factor, which is `base32` alone.
# Everything below is optional and compiled by the factor that uses it.
rainier-support = { workspace = true }
# Both factors: random secrets and challenges, SHA-256, constant-time compares.
rand = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
# `totp` only.
hmac = { workspace = true, optional = true }
# `passkeys` only. WebAuthn is JSON with base64url fields on the wire; TOTP is
# base32, which is in this crate.
base64 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
# HMAC-SHA1 is what every authenticator app computes by default (RFC 6238's
# own default, and the only algorithm Google Authenticator honoured for years).
# 0.11, the digest-0.11 generation `hmac` 0.13 and `sha2` 0.11 are built on.
sha1 = { version = "0.11", default-features = false, optional = true }
# The three signature algorithms a passkey can carry — ES256, EdDSA and RS256.
# Pure Rust, so the crate builds wherever the rest of the framework does.
p256 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
# `sha2` for the PKCS#1 v1.5 DigestInfo prefix: rsa 0.9 is on digest 0.10, so
# it names its own SHA-256 rather than the workspace's.
rsa = { workspace = true, optional = true, features = ["sha2"] }

[features]
default = ["totp"]
# RFC 6238 one-time passwords and single-use recovery codes.
totp = ["dep:hmac", "dep:sha1", "dep:rand", "dep:sha2", "dep:subtle"]
# WebAuthn registration and assertion verification, in pure Rust.
passkeys = [
    "dep:p256",
    "dep:rsa",
    "dep:ed25519-dalek",
    "dep:base64",
    "dep:serde",
    "dep:serde_json",
    "dep:rand",
    "dep:sha2",
    "dep:subtle",
]

[dev-dependencies]
tokio = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
