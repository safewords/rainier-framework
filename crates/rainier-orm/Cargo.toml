[package]
name = "rainier-orm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Rainier's multi-dialect ORM: one #[derive(Entity)] across SQLite, MySQL, Postgres and D1."

[dependencies]
rainier-orm-macros = { workspace = true }

sea-query = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }

# Wasm-safe, all of them. `serde` backs the always-available Json<T> column
# type and `base64` backs Base64Bytes; neither pulls in a runtime.
#
# There are deliberately **no optional driver dependencies here**. Every
# executor lives in `rainier-drivers`, which keeps this crate compilable for a
# `wasm32` target without a feature dance — see the crate docs.
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
