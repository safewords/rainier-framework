[package]
name = "rainier-mail"
description = "Mailables, the mailer, and transports for the Rainier framework."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rainier-support = { workspace = true }
rainier-view = { workspace = true }
rainier-events = { workspace = true }
# The HTTP transport port and its fake — NOT the reqwest socket, which the
# framework turns on. An API transport is a request shape; a test asserts on
# the shape without a network.
rainier-http-client = { workspace = true, optional = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
lettre = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
aws-sdk-sesv2 = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
reqwest = { workspace = true }

[features]
default = []
# A real SMTP server, over lettre with rustls. The direct rustls dependency
# exists to install the ring provider explicitly — see `SmtpBuilder::build`.
smtp = ["dep:lettre", "dep:rustls"]
# Amazon SES, authenticated the way every other AWS driver is: the default
# credential chain — environment, profile, IMDS.
ses = ["dep:aws-config", "dep:aws-sdk-sesv2"]
# The HTTP APIs. Each is one request shape over the framework's own HTTP
# transport port, so the fake records it and a test asserts on it.
postmark = ["dep:rainier-http-client"]
mailgun = ["dep:rainier-http-client"]
sendgrid = ["dep:rainier-http-client"]
resend = ["dep:rainier-http-client"]

# docs.rs builds with default features, which would hide every real transport.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
