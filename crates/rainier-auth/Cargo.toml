[package]
name = "rainier-auth"
description = "Authentication guards, user providers, password hashing and authorization gates for Rainier."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rainier-support = { workspace = true }
# For the `Hasher` port the guards and user providers consume. Hashing is
# cryptography, so it lives with the rest of it.
rainier-crypt = { workspace = true }
rainier-http = { workspace = true }
rainier-middleware = { workspace = true }
rainier-database = { workspace = true }
rainier-session = { workspace = true }
rainier-cache = { workspace = true }
rainier-orm = { workspace = true }
rand = { workspace = true }
subtle = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[features]
# The bcrypt driver and legacy verifier, forwarded to `rainier-crypt`.
bcrypt = ["rainier-crypt/bcrypt"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
