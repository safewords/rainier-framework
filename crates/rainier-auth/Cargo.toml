[package]
name = "rainier-auth"
description = "Authentication guards, user providers, password hashing and authorization gates for Rainier."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rainier-support = { workspace = true }
rainier-http = { workspace = true }
rainier-middleware = { workspace = true }
rainier-database = { workspace = true }
rainier-session = { workspace = true }
rainier-cache = { workspace = true }
rainier-orm = { workspace = true }
argon2 = { workspace = true }
password-hash = { workspace = true }
# Only for reading hashes an application inherited — see `legacy`. Optional
# because an application with no legacy table should not compile it.
bcrypt = { workspace = true, optional = true }
rand = { workspace = true }
subtle = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[features]
# Read `$2a$`/`$2b$`/`$2y$` hashes written by a PHP or Rails application.
bcrypt = ["dep:bcrypt"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
