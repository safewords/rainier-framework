[package]
name = "rainier-notify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Notifications for Rainier: a message to a recipient, over the channels they can be reached on."

[dependencies]
rainier-mail = { workspace = true }
rainier-support = { workspace = true }

serde_json = { workspace = true }
tracing = { workspace = true }
# The HTTP transport port, for the Discord channel — not the socket, which the
# framework's `http-client` feature turns on.
rainier-http-client = { workspace = true, optional = true }

[dev-dependencies]
rainier-view = { workspace = true }
tokio = { workspace = true }

[features]
default = []
# Post notifications to Discord, by webhook or as a bot.
discord = ["dep:rainier-http-client"]
# A `notification.send` span per notification.
telemetry = ["rainier-support/telemetry", "rainier-mail/telemetry"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
