[package]
name = "rainier-events"
description = "Typed event dispatcher, listeners and subscribers — Rainier's hook system."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rainier-support = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
arc-swap = "1"
crossbeam-queue = "0.3"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
# Only for `log_layer`, behind `log-layer`.
tracing-subscriber = { workspace = true, optional = true }

[features]
default = []
# An `event.dispatch` span per event somebody listens for.
telemetry = ["rainier-support/telemetry"]
# `log_layer`: a `tracing_subscriber::Layer` that publishes log events at or
# above a requested level as `LogWritten` activities.
log-layer = ["dep:tracing-subscriber"]

[dev-dependencies]
tokio = { workspace = true }
anyhow = { workspace = true }

[lints]
workspace = true
