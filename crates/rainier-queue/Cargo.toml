[package]
name = "rainier-queue"
description = "Jobs, queue drivers and the worker loop for the Rainier framework."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rainier-support = { workspace = true }
rainier-cache = { workspace = true }
rainier-container = { workspace = true }
rainier-events = { workspace = true }
rainier-database = { workspace = true }
rainier-drivers = { workspace = true, optional = true }
rainier-orm = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true, features = ["alloc"] }
tracing = { workspace = true }

# Kubernetes dispatcher: `batch/v1 Job` creation via kube-rs. Feature-gated
# so a service that doesn't use the k8s path doesn't pull k8s-openapi.
# `KubernetesJobSpec` + `Job::kubernetes()` + `run_single_job` are
# always available; only the dispatcher is behind the feature.
kube = { version = "0.95", default-features = false, features = ["client", "rustls-tls", "runtime"], optional = true }
k8s-openapi = { version = "0.23", features = ["latest"], optional = true }
# rustls 0.23 requires a process-level `CryptoProvider` to be installed
# before any TLS handshake. kube does not install one itself; the
# dispatcher installs ring from `try_in_cluster` so the kube Client's
# first HTTPS to the API server does not panic. Pinned to the same
# version kube pulls in to keep one rustls in the graph.
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }

[features]
default = []
# Jobs on Amazon SQS.
sqs = ["dep:rainier-drivers", "rainier-drivers/aws-sqs"]
# Jobs on Redis streams. Read the `redis` module docs before choosing it.
redis = ["dep:rainier-drivers", "rainier-drivers/redis-driver"]
# Jobs on a sharded Redis cluster. Needed whenever the server is a cluster:
# a single-server client reaches one node and answers `MOVED` for every queue
# whose slot is held by another, draining only part of what it was given.
redis-cluster = ["redis", "rainier-drivers/redis-cluster"]
# Jobs on a Kafka topic. Read the `kafka` module docs first — a log is not a
# queue, and the differences are the kind that cost money.
kafka = ["dep:rainier-drivers", "rainier-drivers/kafka"]
# Kubernetes `batch/v1 Job` dispatcher. The `KubernetesJobSpec` type and
# the `Job::kubernetes()` method are always compiled; this feature adds
# the actual dispatcher + its kube-rs dependency.
kubernetes = ["dep:kube", "dep:k8s-openapi", "dep:rustls"]

[lints]
workspace = true
