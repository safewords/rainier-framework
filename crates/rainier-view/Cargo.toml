[package]
name = "rainier-view"
description = "The view layer for Rainier: the template engine and the View contract."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rainier-support = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Only with `telemetry`.
tracing = { workspace = true, optional = true }

[features]
default = []
# A `view.render` span per template rendered — synchronous, so it is entered
# rather than instrumented.
telemetry = ["dep:tracing", "rainier-support/telemetry"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
