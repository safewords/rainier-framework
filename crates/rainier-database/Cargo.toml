[package]
name = "rainier-database"
description = "Rainier ORM integration for Rainier: the connection port, models, repositories and pagination."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rainier-support = { workspace = true }
rainier-events = { workspace = true }
rainier-orm = { workspace = true }
rainier-drivers = { workspace = true, optional = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Only for `task_local!`, which is what a sticky scope hangs on — see `sticky`.
# `default-features = false` because the default set carries `net`, which pulls
# in mio and stops this crate compiling for wasm; `rainier-container` takes the
# same dependency the same way and for the same reason.
tokio = { version = "1", default-features = false, features = ["rt"] }
tracing = { workspace = true }

[features]
default = []
# The executors live in `rainier-drivers`, so these forward there. Off by
# default, which is what keeps this crate usable from a wasm target.
sea-orm-executor = ["dep:rainier-drivers", "rainier-drivers/sea-orm-executor"]
d1-http = ["dep:rainier-drivers", "rainier-drivers/d1-http"]
libsql-http = ["dep:rainier-drivers", "rainier-drivers/libsql-http"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
