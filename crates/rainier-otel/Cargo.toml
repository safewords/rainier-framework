[package]
name = "rainier-otel"
description = "OpenTelemetry for Rainier: real span ids and an OTLP exporter behind a feature, building on rainier-request-tagging; and the shape of a log line."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rainier-support = { workspace = true }
# The trace context spans join and name: request tagging. Only the exporter
# gives spans ids worth naming.
rainier-request-tagging = { workspace = true, optional = true }

tracing = { workspace = true }

# The exporter. Off by default: it is a large dependency tree, and an
# application that only wants trace headers propagated should not pay for it.
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
# A flush that fails is reported on the bus.
rainier-events = { workspace = true, optional = true }

[features]
default = []
otlp = [
    "dep:rainier-request-tagging",
    "dep:rainier-events",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]

[dev-dependencies]
# The exporter's own tests run on a runtime.
tokio = { workspace = true }

[lints]
workspace = true
