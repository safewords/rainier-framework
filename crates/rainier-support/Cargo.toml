[package]
name = "rainier-support"
description = "Shared primitives for the Rainier framework: errors, futures, type-maps, string helpers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Only for the span helpers in `telemetry`, and only when something asks for
# them: a crate that instruments nothing should not compile a span.
tracing = { workspace = true, optional = true }
# `span::Current`, which `tracing` does not re-export, for the test recorder's
# `Span::current()` to work. Already in every graph that has `tracing`.
tracing-core = { version = "0.1", optional = true }

[features]
default = []
# The shared vocabulary every crate's own `telemetry` feature builds on — see
# `rainier_support::telemetry`.
telemetry = ["dep:tracing", "dep:tracing-core"]

[lints]
workspace = true
